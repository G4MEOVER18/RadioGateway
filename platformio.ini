; PlatformIO Project Configuration – RadioGateway
; Der Sketch nutzt die Arduino-ESP32 Core 3.x LEDC-API (ledcAttach/ledcWrite),
; die das offizielle PlatformIO (Core 2.x) NICHT bietet. Daher der pioarduino-Fork.
;
; Build:  pio run
; Flash:  pio run -t upload
; Monitor: pio device monitor -b 115200

[platformio]
; Arduino-Sketch liegt im Unterordner src/RadioGateway/
src_dir = src/RadioGateway

[env:esp32dev]
; pioarduino-Plattform = Arduino-ESP32 Core 3.1.x (für ledcAttach u.a.)
; Stabile Version mit klassischem Tooling (neuere 54/55.x scheitern auf manchen
; Setups beim penv-Tool-Install).
platform = https://github.com/pioarduino/platform-espressif32/releases/download/53.03.13/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

; Display: LovyanGFX (Pins/Driver werden im Sketch selbst konfiguriert –
; ILI9341 + XPT2046 Touch, Board ESP32-2432S028 "CYD").
lib_deps =
    bblanchon/ArduinoJson@^6.21.5
    knolleary/PubSubClient@^2.8
    lovyan03/LovyanGFX@^1.1.16
